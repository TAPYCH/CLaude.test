<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="План на год: мышление, характер, понимание людей, справедливость и стратегия. 12 месяцев с чек-листами, библиотека, шпаргалки.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161F1D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%2321705E%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-family=%22Georgia,serif%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23F2E5D2%22%3E%D0%9C%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Год мудрости</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header (brand, search, tab rail) over one reading column per tab; the months tab opens with a year strip of 4 quarters x 3 months that doubles as navigation and progress. Palette: bronze-statue verdigris and bronze on cool stone. */
:root{
  --bg:#F1F4F2;
  --surface:#FFFFFF;
  --sunk:#E5EBE8;
  --line:#D2DBD7;
  --fg:#17201E;
  --muted:#55625E;
  --accent:#21705E;
  --accent-soft:#D8EAE3;
  --on-accent:#FFFFFF;
  --bronze:#8A5B24;
  --bronze-soft:#F2E5D2;
  --font-display:"Forum","Cormorant Garamond",Georgia,"Times New Roman",serif;
  --font-body:"Golos Text","PT Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --surface:#161F1D; --sunk:#1F2A28; --line:#2C3A37;
    --fg:#E2E9E6; --muted:#97A6A1; --accent:#5FBDA6; --accent-soft:#1B3932; --on-accent:#0F1513;
    --bronze:#D6A66B; --bronze-soft:#382C1D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#161F1D; --sunk:#1F2A28; --line:#2C3A37;
  --fg:#E2E9E6; --muted:#97A6A1; --accent:#5FBDA6; --accent-soft:#1B3932; --on-accent:#0F1513;
  --bronze:#D6A66B; --bronze-soft:#382C1D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}

.wrap{max-width:60rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding-block:12px 4px}
.brand{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--fg);text-decoration:none;white-space:nowrap}
.search{position:relative;flex:1;min-width:0;max-width:26rem;margin-left:auto}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:15px;line-height:1.3;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--fg);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-8px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:8px 8px 10px;font-size:15px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}

/* Type */
main.wrap{padding-block:32px 72px}
.tab{max-width:46rem}
.tab-wide{max-width:none}
.tab-wide .narrow{max-width:46rem}
h1,h2{font-family:var(--font-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(36px,7vw,50px)}
h2{font-size:clamp(26px,5vw,32px);margin-top:52px;margin-bottom:14px}
h3{font-size:17px;font-weight:600;line-height:1.35;margin:30px 0 8px;text-wrap:balance}
p{margin:0 0 12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
.lead{font-size:18px;line-height:1.55;color:var(--muted);max-width:40rem;margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
ul.plain{margin:0;padding-left:1.1em}
ul.plain li{margin-bottom:8px}
ul.plain li::marker{color:var(--bronze)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:15px;font-weight:500;line-height:1.3;padding:9px 14px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;color:var(--accent)}

/* Today card */
.today{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;justify-content:space-between;margin-top:28px;padding:20px 22px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.today-main{flex:1 1 20rem;min-width:0}
.today-title{font-family:var(--font-display);font-size:28px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
.today-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.today-date{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.today-date input{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--fg)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:24px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{min-width:0}
.stat-n{font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat-of{font-size:19px;color:var(--muted)}
.stat-l{display:block;font-size:13px;line-height:1.35;color:var(--muted);margin-top:6px}
.bar{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:8px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:2px}

/* Quarters on overview */
.quarters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
@media (max-width:600px){.quarters{grid-template-columns:minmax(0,1fr)}}
.quarter{min-width:0}
.quarter-h{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.q-num{font-family:var(--font-display);font-size:22px;color:var(--bronze);line-height:1}
.quarter-name{font-weight:600}
.quarter-sub{font-size:14px;color:var(--muted)}
.qmonths{list-style:none;margin:0 0 12px;padding:0;border-top:1px solid var(--line)}
.qmonths a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.qmonths a:hover .qm-t{text-decoration:underline}
.qm-c{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Qualities */
.qual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
@media (max-width:600px){.qual{grid-template-columns:minmax(0,1fr)}}
.qual h3{margin-top:4px}
.qual ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.qual li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.qt{font-weight:600}
.qd{color:var(--muted);font-size:14px}
.qm{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px}

/* Rows (checklists, resources) */
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.row input[type="checkbox"]{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.row-body{display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.row-tool .row-body{cursor:default}
.row-title{font-weight:500}
.row-by,.row-note{font-size:14px;color:var(--muted)}
.row-side{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:flex-end;font-size:13px;padding-top:2px}
.row input:checked + .row-body .row-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row-tool .dot{width:8px;height:8px;border-radius:2px;background:var(--bronze);margin:9px 0 0 6px}
@media (max-width:600px){
  .row{grid-template-columns:24px minmax(0,1fr)}
  .row-side{grid-column:2;justify-content:flex-start}
}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);font-size:12px;line-height:1.6;white-space:nowrap}
.ext{white-space:nowrap}
.mchip{font-size:12px;line-height:1.5;padding:1px 8px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--fg);white-space:nowrap}
.mchip:hover{border-color:var(--accent);color:var(--accent)}

/* Year strip */
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;margin:24px 0 8px}
@media (max-width:560px){.strip{grid-template-columns:minmax(0,1fr)}}
.q{min-width:0}
.q-label{font-size:13px;color:var(--muted);margin:0 0 6px;display:flex;align-items:baseline;gap:8px}
.q-label .q-num{font-size:18px}
.q-cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{position:relative;display:flex;flex-direction:column;gap:2px;padding:8px 10px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);text-decoration:none;min-width:0}
.cell:hover{border-color:var(--muted)}
.cell.is-sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell-n{font-family:var(--font-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.cell-t{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.cell .bar{margin-top:6px}
.cell .now{position:absolute;top:8px;right:9px;font-size:11px;line-height:1.2;color:var(--bronze);font-weight:600}

/* Month detail */
#month-detail{margin-top:40px}
.month-title{margin-top:8px}
.understand{margin-top:34px;padding:20px 22px;border-radius:12px;background:var(--bronze-soft)}
.understand .eyebrow{color:var(--bronze)}
.understand .u{font-family:var(--font-display);font-size:25px;line-height:1.3;margin:0;text-wrap:pretty}
.month-nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}

/* Table */
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 14px 8px 0;border-bottom:1px solid var(--line)}
td{padding:11px 14px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.when{color:var(--muted);white-space:nowrap}
td.t{white-space:nowrap;font-variant-numeric:tabular-nums}

/* Definition lists */
.defs{margin:0;border-top:1px solid var(--line)}
.def{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr);gap:4px 22px;padding:12px 0;border-bottom:1px solid var(--line)}
.def dt{font-weight:600}
.def dd{margin:0}
@media (max-width:600px){.def{grid-template-columns:minmax(0,1fr)}}
.no{padding:14px 16px;border-radius:var(--r);background:var(--sunk)}
.no b{color:var(--fg)}

/* Laws */
.laws{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.laws li{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.laws .n{font-family:var(--font-display);font-size:22px;line-height:1.15;color:var(--bronze);font-variant-numeric:tabular-nums}

/* Tools */
.tools{display:grid;gap:0;border-top:1px solid var(--line)}
.tool{padding:14px 0 16px;border-bottom:1px solid var(--line)}
.tool h3{margin:0 0 6px}
.tool .key{display:inline-block;margin-left:8px;font-size:12px;font-weight:500;color:var(--bronze);vertical-align:2px}
.example{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.example span{font-size:14px;padding:4px 10px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}

/* Sub navigation, filters */
.subnav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.subnav a{font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--fg);background:var(--surface)}
.subnav a:hover{border-color:var(--accent);color:var(--accent)}
.lib-tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin:24px 0 6px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{font:inherit;font-size:14px;line-height:1.3;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);cursor:pointer}
.fchip:hover{border-color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fchip .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:6px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.group-h{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:30px 0 4px}
.group-h a{color:inherit;text-decoration:none}
.group-h a:hover{color:var(--accent)}
.empty{padding:24px 0;color:var(--muted)}

/* Search */
.hits{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:16px}
.hit{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:4px 14px;align-items:start;text-align:left;font:inherit;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);padding:12px 6px;cursor:pointer;width:100%}
.hit:hover{background:var(--surface)}
.hit .chip{justify-self:start;margin-top:2px}
.hit-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.hit-t{font-weight:500}
.hit-c{font-size:13px;color:var(--muted)}
@media (max-width:480px){.hit{grid-template-columns:minmax(0,1fr)}}

/* Progress transfer */
.xfer{display:grid;gap:8px;margin-top:12px}
.xfer label{font-size:14px;color:var(--muted);margin-top:8px}
.xfer-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.xfer-row input{flex:1 1 16rem;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg)}
#xfer-code,#xfer-input{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:14px}
.xfer-confirm{padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);margin-top:8px}
.xfer-confirm p{margin-bottom:10px}
.xfer-msg{font-size:14px;color:var(--muted);min-height:1.5em;margin:4px 0 0;overflow-wrap:anywhere}

/* Footer */
footer.wrap{padding-block:20px 40px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;border-top:1px solid var(--line)}

@keyframes flash{0%,45%{background:var(--bronze-soft)}100%{background:transparent}}
.flash{animation:flash 2.2s ease-out}
@media (prefers-reduced-motion: reduce){
  .flash{animation:none;background:var(--bronze-soft)}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <a class="brand" href="#overview">Год мудрости</a>
      <div class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M10.8 10.8l3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
        <input id="q" type="search" placeholder="Поиск по плану" aria-label="Поиск по плану" autocomplete="off" enterkeyhint="search">
      </div>
    </div>
    <nav class="tabs" aria-label="Разделы">
      <a href="#overview" data-tab="overview">Обзор</a>
      <a href="#daily" data-tab="daily">Каждый день</a>
      <a href="#months" data-tab="months">12 месяцев</a>
      <a href="#library" data-tab="library">Библиотека</a>
      <a href="#notes" data-tab="notes">Шпаргалки</a>
      <a href="#results" data-tab="results">Итоги</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <section class="tab" id="tab-overview" aria-label="Обзор"></section>
  <section class="tab" id="tab-daily" aria-label="Каждый день" hidden></section>
  <section class="tab tab-wide" id="tab-months" aria-label="12 месяцев" hidden></section>
  <section class="tab tab-wide" id="tab-library" aria-label="Библиотека" hidden></section>
  <section class="tab" id="tab-notes" aria-label="Шпаргалки" hidden></section>
  <section class="tab" id="tab-results" aria-label="Итоги" hidden></section>
  <section class="tab tab-wide" id="tab-search" aria-label="Результаты поиска" aria-live="polite" hidden></section>
</main>

<footer class="wrap">
  <span id="sync">Подключаю сохранение отметок…</span>
  <a href="#transfer">Перенести прогресс на другое устройство</a>
</footer>

<script>
(function(){
"use strict";

/* ---------- storage helpers ---------- */
var LS = "god-mudrosti-v1";
function lsGet(k){ try{ return localStorage.getItem(LS + ":" + k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(LS + ":" + k, v); }catch(e){} }

var state = { done:{}, start:null };
try{
  var raw = lsGet("state");
  if(raw){
    var s = JSON.parse(raw);
    if(s && typeof s === "object"){
      state.done = (s.done && typeof s.done === "object") ? s.done : {};
      state.start = typeof s.start === "string" ? s.start : null;
    }
  }
}catch(e){}

/* ---------- content ---------- */
var QUARTERS = [
  { q:1, roman:"I",   name:"Сначала я",       sub:"Ум и характер",                    months:[1,2,3] },
  { q:2, roman:"II",  name:"Люди",            sub:"Чтение людей, ложь, желания",      months:[4,5,6] },
  { q:3, roman:"III", name:"Справедливость",  sub:"Мораль и природа человека",        months:[7,8,9] },
  { q:4, roman:"IV",  name:"На шаг впереди",  sub:"Стратегия, прогнозы, мастерство",  months:[10,11,12] }
];

var MONTHS = [
  { n:1, q:1, short:"Мышление", title:"Как работает мышление и где оно ошибается",
    practice:[
      { id:"p1-1", text:"Каждый вечер находи у себя одно когнитивное искажение и записывай его в дневник." },
      { id:"p1-2", text:"Делай минимум три новых прогноза в неделю в журнале прогнозов." },
      { id:"p1-3", text:"Заводи в Anki карточку на каждое новое искажение." }
    ],
    understand:"Умный человек не тот, кто не ошибается, а тот, кто знает, как именно он ошибается." },

function currentMonth(){
  if(!state.start || !/^\d{4}-\d{2}-\d{2}$/.test(state.start)) return null;
  var p = state.start.split("-").map(Number);
  var start = new Date(p[0], p[1]-1, p[2]);
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.round((today - start) / 86400000);
  if(days < 0) return { phase:"before", days:-days };
  var diff = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth()) - (today.getDate() < start.getDate() ? 1 : 0);
  var n = diff + 1;
  if(n > 12) return { phase:"done", days:days };
  return { phase:"active", n:n, days:days };
}

  var a = n % 10, b = n % 100;

}

/* ---------- PROGRESS CODE ---------- */
function encodeProgress(){
  var bytes = new Array(Math.ceil(CODE_IDS.length / 8)).fill(0);
  CODE_IDS.forEach(function(id, i){ if(state.done[id]) bytes[i >> 3] |= 1 << (i & 7); });
  var b64 = btoa(String.fromCharCode.apply(null, bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return "GM1." + (state.start ? state.start.replace(/-/g, "") : "0") + "." + b64;
}
function decodeProgress(code){
  var m = /^GM1\.(\d{8}|0)\.([A-Za-z0-9_-]+)$/.exec(String(code || "").trim());
  if(!m) return null;
  var b64 = m[2].replace(/-/g, "+").replace(/_/g, "/");
  while(b64.length % 4) b64 += "=";
  var bin; try{ bin = atob(b64); }catch(e){ return null; }
  var done = {};
  CODE_IDS.forEach(function(id, i){ if((bin.charCodeAt(i >> 3) || 0) & (1 << (i & 7))) done[id] = 1; });
  var start = m[1] === "0" ? null : m[1].slice(0,4) + "-" + m[1].slice(4,6) + "-" + m[1].slice(6,8);
  return { done:done, start:start };
}
function renderXfer(){ var c = $("#xfer-code"); if(c) c.value = encodeProgress(); }
function syncLink(){ return location.origin + location.pathname + "#sync=" + encodeProgress(); }
function fmtDate(iso){
  var p = iso.split("-").map(Number);
  return new Date(p[0], p[1]-1, p[2]).toLocaleDateString("ru-RU", { day:"numeric", month:"long" }) + " " + p[0];
}

function previewImport(code){
  var msg = $("#xfer-msg"), box = $("#xfer-confirm"); if(!msg || !box) return;
  var dec = decodeProgress(code);

    msg.textContent = "Код не распознан. Скопируй его целиком: он начинается с GM1.";

  }

  var cur = CODE_IDS.filter(function(id){ return state.done[id]; }).length;
  box.innerHTML = '<p>В коде отмечено ' + n + ' ' + plural(n, "пункт", "пункта", "пунктов") +
    (dec.start ? ", дата старта " + esc(fmtDate(dec.start)) : ", дата старта не указана") +
    '. Сейчас здесь отмечено ' + cur + '. Заменить прогресс на этом устройстве прогрессом из кода?</p>' +
    '<div class="xfer-row"><button type="button" class="btn" data-act="apply-import">Заменить</button><button type="button" class="btn btn-ghost" data-act="cancel-import">Отмена</button></div>';
  box.hidden = false; msg.textContent = "";
}

/* ---------- PROGRESS + SYNC ---------- */
var dbRef = null, remoteReady = false, writing = false, again = false, wtimer = null, retried = false;
var sessionEdits = {}, startEdited = false;

function setSync(kind){
  var el = $("#sync"); if(!el) return;
  el.textContent = {
    pending:"Подключаю сохранение отметок…",
    cloud:"Отметки сохраняются в твоём аккаунте и видны на всех устройствах.",
    local:"Отметки сохраняются только в этом браузере.",
    error:"Не удалось сохранить в аккаунт. Отметки пока хранятся в этом браузере."
  }[kind] || "";
}
function persist(){
  lsSet("state", JSON.stringify({ done:state.done, start:state.start }));
  if(dbRef && remoteReady){ clearTimeout(wtimer); wtimer = setTimeout(flush, 700); }
}
function flush(){
  wtimer = null;
  if(!dbRef) return;
  if(writing){ again = true; return; }
  writing = true;
  dbRef.set({ done:state.done, start:state.start || null }).then(function(){
    retried = false; setSync("cloud");
  }, function(e){
    if(e && e.code === "unavailable" && !retried){ retried = true; setTimeout(flush, 800 + Math.random() * 1200); }
    else setSync("error");
  }).then(function(){
    writing = false;
    if(again){ again = false; flush(); }
  });
}
function refreshAll(){
  $$("input[data-item]").forEach(function(c){ c.checked = !!state.done[c.dataset.item]; });
  renderToday(); renderStats(); renderOverviewQuarters(); renderStrip(); updateMonthProg(); applyLibFilter(); renderXfer();
}
function toggle(id, val){
  if(val) state.done[id] = 1; else delete state.done[id];
  if(!remoteReady) sessionEdits[id] = val;
  $$('input[data-item="' + id + '"]').forEach(function(c){ c.checked = val; });
  renderToday(); renderStats(); renderOverviewQuarters(); renderStrip(); updateMonthProg(); applyLibFilter(); renderXfer();
  persist();
}
function setStart(v){
  state.start = v || null;
  if(!remoteReady) startEdited = true;
  var cm = currentMonth();
  if(cm && cm.phase === "active" && !lsGet("month")){ selMonth = cm.n; renderMonth(); }
  renderToday(); renderStrip(); renderXfer();
  persist();
}
function applyRemote(d){
  state = { done: Object.assign({}, (d && typeof d.done === "object" && d.done) || {}), start: d && typeof d.start === "string" ? d.start : null };
}
function initRemote(){
  var c = window.claude;
  if(!c || typeof c.use !== "function"){ setSync("local"); return; }
  Promise.all([c.use("db"), c.use("user")]).then(function(res){
    var db = res[0], user = res[1];
    if(!db || !user){ setSync("local"); return null; }
    return user.id().then(function(uid){
      if(!uid){ setSync("local"); return; }
      try{ dbRef = db.doc("data/users/" + uid + "/progress"); }catch(e){ dbRef = null; setSync("local"); return; }
      dbRef.onSnapshot(function(snap){
        if(snap.metadata && snap.metadata.hasPendingWrites) return;
        if(!remoteReady){
          if(snap.metadata && snap.metadata.fromCache) return;
          remoteReady = true;
          var edited = Object.keys(sessionEdits).length > 0 || startEdited;
          if(snap.exists){
            var local = state;
            applyRemote(snap.data());
            Object.keys(sessionEdits).forEach(function(id){ if(sessionEdits[id]) state.done[id] = 1; else delete state.done[id]; });
            if(startEdited) state.start = local.start;
            lsSet("state", JSON.stringify({ done:state.done, start:state.start }));
            refreshAll(); setSync("cloud");
            if(edited) flush();
          } else {
            setSync("cloud");
            if(Object.keys(state.done).length || state.start) flush();
          }
          return;
        }
        if(writing || wtimer || !snap.exists) return;
        applyRemote(snap.data());
        lsSet("state", JSON.stringify({ done:state.done, start:state.start }));
        refreshAll();
      }, function(err){
        dbRef = null; remoteReady = false;
        setSync(err && err.code === "revoked" ? "local" : "error");
      });
    });
  }).catch(function(){ setSync("local"); });
}

$("#q").addEventListener("input", doSearch);
$("#q").addEventListener("keydown", function(e){
  if(e.key === "Escape"){ clearSearch(); if(currentTab) $("#tab-" + currentTab).hidden = false; e.target.blur(); }
  if(e.key === "Enter"){ var first = $("#tab-search .hit"); if(first) first.click(); }
});
document.addEventListener("keydown", function(e){
  if(e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
  var a = document.activeElement;
  if(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable)) return;
  e.preventDefault(); $("#q").focus();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Enter" && e.target && e.target.id === "xfer-input"){ e.preventDefault(); previewImport(e.target.value); }
});
window.addEventListener("hashchange", route);

/* ---------- init ---------- */
renderOverview(); renderToday(); renderStats(); renderOverviewQuarters(); renderXfer();
renderDaily(); renderMonthsTab(); renderLibrary(); renderNotes(); renderResults();
buildIndex();
route();
setSync("pending");
initRemote();
setTimeout(function(){ if(!remoteReady && $("#sync").textContent.indexOf("Подключаю") === 0) setSync("local"); }, 12000);
})();
